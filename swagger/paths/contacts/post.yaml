tags:
  - Contacts
summary: Create contact
operationId: createContact
description: Create contact
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
        properties:
          name:
            type: string
            description: Contact name
            example: John Doe
          phoneNumber:
            type: string
            description: Contact number
            example: '0981234567'
          email:
            type: string
            description: Contact mail
            example: john@gmail.com
          isFavourite:
            type: boolean
            description: If contact is favourite
            example: false
            default: true
          contactType:
            type: string
            description: Type of contact
            example: personal
          photo:
            type: string
            format: binary
            description: Contact photo
responses:
  '201':
    description: Created a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact created successfully
            data:
              $ref: '../../components/schemas/contact.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
