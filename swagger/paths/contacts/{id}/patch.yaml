tags:
  - Contacts
summary: Patch contact by ID
operationId: patchContact
description: Patch a contact by ID
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    description: ID of the contact to patch
    schema:
      type: string
      example: 507f1f77bcf86cd799439011
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: Contact name
            type: string
            example: 'John Doe'
          phoneNumber:
            description: Contacts number
            type: string
            example: '09812345678'
          contactType:
            description: Type of contacts
            type: string
            enum: ['work', 'home', 'personal']
            default: 'personal'
          email:
            description: Contacts mail
            type: string
            example: john@mail.com
          isFavourite:
            description: Whether the contact is a favourite
            type: boolean
            default: false
            example: true
          photo:
            description: Contacts photo
            type: string
            format: binary
            example: https://res.cloudinary.com/dbidpmkqe/image/upload/v1749681002/bp6ug7s60tcjemn8gve4.jpg
responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact updated successfully
            data:
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
